<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <f:metadata>
            <f:viewAction action="#{itemController.resetListMode}" />
        </f:metadata>
        <ui:define name="title">
            <h:outputText value="#{bundle.ListItemTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <div class="list-toolbar">
                    <span class="list-toolbar-left">
                        <h:outputText escape="false" value="#{bundle.ListItemEmpty}" rendered="#{itemController.items.rowCount == 0}"/>
                        <h:panelGroup rendered="#{itemController.items.rowCount > 0}">
                            <h:outputText value="#{itemController.pagination.pageFirstItem + 1}..#{itemController.pagination.pageLastItem + 1}/#{itemController.pagination.itemsCount}"/>&nbsp;
                            <h:commandLink action="#{itemController.previous}" value="#{bundle.Previous} #{itemController.pagination.pageSize}" rendered="#{itemController.pagination.hasPreviousPage}"/>&nbsp;
                            <h:commandLink action="#{itemController.next}" value="#{bundle.Next} #{itemController.pagination.pageSize}" rendered="#{itemController.pagination.hasNextPage}"/>&nbsp;
                        </h:panelGroup>
                    </span>
                    <span class="list-toolbar-right">
                        <h:commandButton action="#{itemController.prepareCreate}" value="#{bundle.ListItemCreateLink}" rendered="#{loginBean.loggedIn}" styleClass="btn" />
                    </span>
                </div>
                <h:panelGroup rendered="#{itemController.items.rowCount > 0}">
                    <h:dataTable value="#{itemController.items}" var="item" styleClass="browse-table" rowClasses="jsfcrud_odd_row,jsfcrud_even_row">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListItemTitle_image}"/>
                            </f:facet>
                            <h:graphicImage value="#{item.imageUrl}" width="120" height="90" style="object-fit: cover; border-radius: 6px;" rendered="#{not empty item.imageUrl}" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListItemTitle_title}"/>
                            </f:facet>
                            <h:outputText value="#{item.title}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListItemTitle_description}"/>
                            </f:facet>
                            <h:outputText value="#{item.description}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListItemTitle_price}"/>
                            </f:facet>
                            <h:outputText value="#{item.price}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListItemTitle_status}"/>
                            </f:facet>
                            <h:outputText value="#{item.status}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListItemTitle_category}"/>
                            </f:facet>
                            <h:outputText value="#{item.categoryId.name}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListItemTitle_seller}"/>
                            </f:facet>
                            <h:outputText value="#{item.sellerId.username} #{item.sellerId.phone}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="&nbsp;"/>
                            </f:facet>
                            <h:commandLink action="#{itemController.prepareView}" value="#{bundle.ListItemViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{itemController.prepareEdit}" value="#{bundle.ListItemEditLink}"
                                rendered="#{loginBean.admin or (loginBean.loggedIn and item.sellerId.id == loginBean.loggedInUser.id)}" />
                            <h:outputText value=" "
                                rendered="#{loginBean.admin or (loginBean.loggedIn and item.sellerId.id == loginBean.loggedInUser.id)}" />
                            <h:commandLink action="#{itemController.destroy}" value="#{bundle.ListItemDestroyLink}"
                                rendered="#{loginBean.admin or (loginBean.loggedIn and item.sellerId.id == loginBean.loggedInUser.id)}" />
                            <h:outputText value=" " />
                            <h:commandButton value="Add to Cart" action="#{cartItemController.addToCart(item)}"
                                rendered="#{loginBean.loggedIn and !loginBean.admin and item.status == 'AVAILABLE'}"
                                styleClass="btn" />
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
                <br />
                
            </h:form>
        </ui:define>
    </ui:composition>

</html>
