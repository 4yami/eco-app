<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewItemTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputText value="#{bundle.ViewItemLabel_id}"/>
                    <h:outputText value="#{itemController.selected.id}" title="#{bundle.ViewItemTitle_id}"/>
                    <h:outputText value="#{bundle.ViewItemLabel_title}"/>
                    <h:outputText value="#{itemController.selected.title}" title="#{bundle.ViewItemTitle_title}"/>
                    <h:outputText value="#{bundle.ViewItemLabel_description}"/>
                    <h:outputText value="#{itemController.selected.description}" title="#{bundle.ViewItemTitle_description}"/>
                    <h:outputText value="#{bundle.ViewItemLabel_price}"/>
                    <h:outputText value="#{itemController.selected.price}" title="#{bundle.ViewItemTitle_price}"/>
                    <h:outputText value="#{bundle.ViewItemLabel_status}"/>
                    <h:outputText value="#{itemController.selected.status}" title="#{bundle.ViewItemTitle_status}"/>
                    <h:outputText value="#{bundle.ViewItemLabel_imageUrl}"/>
                    <h:outputText value="#{itemController.selected.imageUrl}" title="#{bundle.ViewItemTitle_imageUrl}"/>
                    <h:outputText value="#{bundle.ViewItemLabel_sellerId}"/>
                    <h:outputText value="#{itemController.selected.sellerId}" title="#{bundle.ViewItemTitle_sellerId}"/>
                    <h:outputText value="#{bundle.ViewItemLabel_categoryId}"/>
                    <h:outputText value="#{itemController.selected.categoryId}" title="#{bundle.ViewItemTitle_categoryId}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{itemController.destroyAndView}" value="#{bundle.ViewItemDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewItemEditLink}"/>
                <br />
                <h:commandLink action="#{itemController.prepareCreate}" value="#{bundle.ViewItemCreateLink}" />
                <br />
                <h:commandLink action="#{itemController.prepareList}" value="#{bundle.ViewItemShowAllLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ViewItemIndexLink}"/>

            </h:form>
        </ui:define>
    </ui:composition>

</html>
