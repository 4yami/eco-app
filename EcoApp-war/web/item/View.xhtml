<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewItemTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputText value="#{bundle.ViewItemLabel_title}"/>
                    <h:outputText value="#{itemController.selected.title}" title="#{bundle.ViewItemTitle_title}"/>
                    <h:outputText value="#{bundle.ViewItemLabel_description}"/>
                    <h:outputText value="#{itemController.selected.description}" title="#{bundle.ViewItemTitle_description}"/>
                    <h:outputText value="#{bundle.ViewItemLabel_price}"/>
                    <h:outputText value="#{itemController.selected.price}" title="#{bundle.ViewItemTitle_price}"/>
                    <h:outputText value="#{bundle.ViewItemLabel_status}"/>
                    <h:outputText value="#{itemController.selected.status}" title="#{bundle.ViewItemTitle_status}"/>
                    <h:outputText value="#{bundle.ViewItemLabel_image}"/>
                    <h:graphicImage value="#{itemController.selected.imageUrl}" width="300" style="max-width: 100%; border-radius: 6px;" rendered="#{not empty itemController.selected.imageUrl}" />
                    <h:outputText value="#{bundle.ViewItemLabel_seller}"/>
                    <h:outputText value="#{itemController.selected.sellerId.username} #{itemController.selected.sellerId.phone}" title="#{bundle.ViewItemTitle_seller}"/>
                    <h:outputText value="#{bundle.ViewItemLabel_category}"/>
                    <h:outputText value="#{itemController.selected.categoryId.name}" title="#{bundle.ViewItemTitle_category}"/>
                </h:panelGrid>
                <br />
                <h:commandButton value="Add to Cart" action="#{cartItemController.addToCart(itemController.selected)}"
                    rendered="#{loginBean.loggedIn and !loginBean.admin and itemController.selected.status == 'AVAILABLE'}"
                    styleClass="btn" />
                
                <br /><br />
                <h:commandLink action="#{itemController.destroyAndView}" value="#{bundle.ViewItemDestroyLink}"
                    rendered="#{loginBean.admin or (loginBean.loggedIn and itemController.selected.sellerId.id == loginBean.loggedInUser.id)}" />
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewItemEditLink}"
                    rendered="#{loginBean.admin or (loginBean.loggedIn and itemController.selected.sellerId.id == loginBean.loggedInUser.id)}" />
                <br />
                <h:commandLink action="#{itemController.prepareCreate}" value="#{bundle.ViewItemCreateLink}" rendered="#{loginBean.loggedIn}" />
                <br />
                <h:commandLink action="#{itemController.prepareList}" value="#{bundle.ViewItemShowAllLink}"/>
                

            </h:form>
        </ui:define>
    </ui:composition>

</html>
