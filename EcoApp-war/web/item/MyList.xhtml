<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <f:metadata>
            <f:viewAction action="#{loginBean.requireLogin}" />
            <f:viewAction action="#{itemController.enterMyItemsMode}" />
        </f:metadata>
        <ui:define name="title">
            <h:outputText value="My Items"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <h:panelGroup rendered="#{not empty itemController.pendingApprovals}">
                    <h2>Pending Approvals</h2>
                    <h:dataTable value="#{itemController.pendingApprovals}" var="pending" styleClass="browse-table" rowClasses="jsfcrud_odd_row,jsfcrud_even_row">
                        <h:column>
                            <f:facet name="header"><h:outputText value="Item"/></f:facet>
                            <h:outputText value="#{pending.title}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header"><h:outputText value="Buyer"/></f:facet>
                            <h:outputText value="#{itemController.getBuyerForItem(pending)}"/>
                            <div><h:outputText value="#{itemController.getBuyerPhoneForItem(pending)}"/></div>
                        </h:column>
                        <h:column>
                            <f:facet name="header"><h:outputText value="Price"/></f:facet>
                            <h:outputText value="$#{pending.price}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header"><h:outputText value="Actions"/></f:facet>
                            <h:commandButton value="Approve" action="#{itemController.approveItem(pending)}" styleClass="btn" />
                            <h:outputText value=" " />
                            <h:commandButton value="Reject" action="#{itemController.rejectItem(pending)}" styleClass="btn btn-outline" />
                        </h:column>
                    </h:dataTable>
                    <hr style="margin: 20px 0; border: none; border-top: 2px solid #d4e4d4;" />
                </h:panelGroup>
                <div class="list-toolbar">
                    <span class="list-toolbar-left">
                        <h:outputText escape="false" value="You haven't listed any items yet." rendered="#{itemController.items.rowCount == 0}"/>
                        <h:panelGroup rendered="#{itemController.items.rowCount > 0}">
                            <h:outputText value="#{itemController.pagination.pageFirstItem + 1}..#{itemController.pagination.pageLastItem + 1}/#{itemController.pagination.itemsCount}"/>&nbsp;
                            <h:commandLink action="#{itemController.previous}" value="#{bundle.Previous} #{itemController.pagination.pageSize}" rendered="#{itemController.pagination.hasPreviousPage}"/>&nbsp;
                            <h:commandLink action="#{itemController.next}" value="#{bundle.Next} #{itemController.pagination.pageSize}" rendered="#{itemController.pagination.hasNextPage}"/>&nbsp;
                        </h:panelGroup>
                    </span>
                    <span class="list-toolbar-right">
                        <h:commandButton action="#{itemController.prepareCreate}" value="#{bundle.ListItemCreateLink}" styleClass="btn" />
                    </span>
                </div>
                    <h:dataTable value="#{itemController.items}" var="item" border="0" cellpadding="2" cellspacing="0" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" rules="all" style="border:solid 1px">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListItemTitle_title}"/>
                            </f:facet>
                            <h:outputText value="#{item.title}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListItemTitle_price}"/>
                            </f:facet>
                            <h:outputText value="#{item.price}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListItemTitle_status}"/>
                            </f:facet>
                            <h:outputText value="#{item.status}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListItemTitle_image}"/>
                            </f:facet>
                            <h:graphicImage value="#{item.imageUrl}" width="60" height="60" style="object-fit: cover; border-radius: 4px;" rendered="#{not empty item.imageUrl}" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="&nbsp;"/>
                            </f:facet>
                            <h:commandLink action="#{itemController.prepareView}" value="#{bundle.ListItemViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{itemController.prepareEdit}" value="#{bundle.ListItemEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{itemController.destroy}" value="#{bundle.ListItemDestroyLink}"/>
                        </h:column>
                    </h:dataTable>
                <br />
                
            </h:form>
        </ui:define>
    </ui:composition>

</html>
