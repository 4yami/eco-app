<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <f:metadata>
            <f:viewAction action="#{loginBean.requireLogin}" />
        </f:metadata>
        <ui:define name="title">
            <h:outputText value="#{bundle.EditItemTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditItemLabel_id}" for="id" />
                    <h:outputText id="id" value="#{itemController.selected.id}" />
                    <h:outputLabel value="#{bundle.EditItemLabel_title}" for="title" />
                    <h:inputText id="title" value="#{itemController.selected.title}" title="#{bundle.EditItemTitle_title}" required="true" requiredMessage="#{bundle.EditItemRequiredMessage_title}"/>
                    <h:outputLabel value="#{bundle.EditItemLabel_description}" for="description" />
                    <h:inputText id="description" value="#{itemController.selected.description}" title="#{bundle.EditItemTitle_description}" />
                    <h:outputLabel value="#{bundle.EditItemLabel_price}" for="price" />
                    <h:inputText id="price" value="#{itemController.selected.price}" title="#{bundle.EditItemTitle_price}" required="true" requiredMessage="#{bundle.EditItemRequiredMessage_price}"/>
                    <h:outputLabel value="#{bundle.EditItemLabel_status}" for="status" />
                    <h:inputText id="status" value="#{itemController.selected.status}" title="#{bundle.EditItemTitle_status}" required="true" requiredMessage="#{bundle.EditItemRequiredMessage_status}"/>
                    <h:outputLabel value="#{bundle.EditItemLabel_image}" for="imageUrl" />
                    <h:inputText id="imageUrl" value="#{itemController.selected.imageUrl}" title="#{bundle.EditItemTitle_image}" />
                    <h:outputLabel value="#{bundle.EditItemLabel_seller}" for="sellerId" rendered="#{loginBean.admin}" />
                    <h:selectOneMenu id="sellerId" value="#{itemController.selected.sellerId}" title="#{bundle.EditItemTitle_seller}" rendered="#{loginBean.admin}">
                        <f:selectItems value="#{appUserController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                    <h:outputLabel value="#{bundle.EditItemLabel_category}" for="categoryId" />
                    <h:selectOneMenu id="categoryId" value="#{itemController.selected.categoryId}" title="#{bundle.EditItemTitle_category}" >
                        <f:selectItems value="#{categoryController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <h:commandLink action="#{itemController.update}" value="#{bundle.EditItemSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditItemViewLink}"/>
                <br />
                <h:commandLink action="#{itemController.prepareList}" value="#{bundle.EditItemShowAllLink}" immediate="true"/>
                
            </h:form>
        </ui:define>
    </ui:composition>

</html>
