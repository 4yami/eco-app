<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
                <f:metadata>
            <f:viewAction action="#{loginBean.requireLogin}" />
            <f:viewAction action="#{itemController.prepareCreate}" />
        </f:metadata>
                <ui:define name="title">
            <h:outputText value="#{bundle.CreateItemTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2" styleClass="panel-grid-form" columnClasses="labelCol,inputCol">
                        <h:outputLabel value="#{bundle.CreateItemLabel_title}" for="title" />
                        <h:inputText id="title" value="#{itemController.selected.title}" 
                                     title="#{bundle.CreateItemTitle_title}" 
                                     required="true" requiredMessage="#{bundle.CreateItemRequiredMessage_title}"
                                     style="width: 100%;" />

                        <h:outputLabel value="#{bundle.CreateItemLabel_description}" for="description" />
                        <h:inputTextarea id="description" value="#{itemController.selected.description}" 
                                         title="#{bundle.CreateItemTitle_description}" 
                                         required="true" requiredMessage="#{bundle.CreateItemRequiredMessage_description}"
                                         rows="4" style="width: 100%;" />

                        <h:outputLabel value="#{bundle.CreateItemLabel_price}" for="price" />
                        <h:inputText id="price" value="#{itemController.selected.price}" 
                                     title="#{bundle.CreateItemTitle_price}" 
                                     required="true" requiredMessage="#{bundle.CreateItemRequiredMessage_price}"
                                     style="width: 100%;" />

                        <h:outputLabel value="#{bundle.CreateItemLabel_image}" for="imageUrl" />
                        <h:inputText id="imageUrl" value="#{itemController.selected.imageUrl}" 
                                     title="#{bundle.CreateItemTitle_image}"
                                     required="true" requiredMessage="#{bundle.CreateItemRequiredMessage_image}"
                                     style="width: 100%;" />

                        <h:outputLabel value="#{bundle.CreateItemLabel_seller}" for="sellerId" rendered="#{loginBean.admin}" />
                        <h:selectOneMenu id="sellerId" value="#{itemController.selected.sellerId}" 
                                         title="#{bundle.CreateItemTitle_seller}" rendered="#{loginBean.admin}"
                                         required="true" requiredMessage="#{bundle.CreateItemRequiredMessage_seller}"
                                         style="width: 100%;">
                            <f:selectItem itemLabel="Select a seller..." itemValue="" noSelectionOption="true" />
                            <f:selectItems value="#{appUserController.itemsAvailableSelectOne}"/>
                        </h:selectOneMenu>

                        <h:outputLabel value="#{bundle.CreateItemLabel_category}" for="categoryId" />
                        <h:selectOneMenu id="categoryId" value="#{itemController.selected.categoryId}" 
                                         title="#{bundle.CreateItemTitle_category}" 
                                         required="true" requiredMessage="#{bundle.CreateItemRequiredMessage_category}"
                                         style="width: 100%;">
                            <f:selectItem itemLabel="Select a category..." itemValue="" noSelectionOption="true" />
                            <f:selectItems value="#{categoryController.itemsAvailableSelectOne}"/>
                        </h:selectOneMenu>
                    </h:panelGrid>
                    <h:commandButton action="#{itemController.create}" value="#{bundle.CreateItemSaveLink}" styleClass="btn"/>
                    <br />
                    <br />
                    
            </h:form>
            
            <script type="text/javascript">
                // <![CDATA[
                window.addEventListener('DOMContentLoaded', function() {
                    var inputs = document.querySelectorAll('input[type="text"], input[type="url"], input[type="number"], textarea');
                    var placeholders = {
                        'title': 'e.g. Vintage Leather Jacket',
                        'description': 'e.g. A brief description of the item...',
                        'price': 'e.g. 29.99',
                        'imageUrl': 'e.g. https://i.imgur.com/abc123.jpg'
                    };
                    for (var i = 0; i < inputs.length; i++) {
                        var input = inputs[i];
                        var inputId = input.id;
                        if (inputId) {
                            for (var key in placeholders) {
                                if (inputId.endsWith(key)) {
                                    input.placeholder = placeholders[key];
                                    break;
                                }
                            }
                        }
                    }
                });
                // ]]>
            </script>
        </ui:define>
    </ui:composition>

</html>
