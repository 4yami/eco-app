<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Account Login</title>
        </h:head>
    <h:body>
        <div class="login-container" style="margin: 50px auto; width: 300px;">
            <h:form id="loginForm">
                <h2>Login to Your Account</h2>
                
                <h:messages globalOnly="true" style="color: red;" />

                <h:panelGrid columns="2" cellpadding="5">
                    <h:outputLabel for="username" value="Username:" />
                    <h:inputText id="username" value="#{loginBean.username}" 
                                 required="true" requiredMessage="Username is required." />
                    
                    <h:outputLabel for="password" value="Password:" />
                    <h:inputSecret id="password" value="#{loginBean.password}" 
                                   required="true" requiredMessage="Password is required." />
                </h:panelGrid>
                
                <br />
                <h:commandButton value="Login" action="#{loginBean.login}" style="width: 100%;" />
                
                <p>Don't have an account? <h:link outcome="register" value="Register here" /></p>
            </h:form>
        </div>
    </h:body>
</html>
