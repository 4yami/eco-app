<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <ui:composition template="/template.xhtml">
        <f:metadata>
            <f:viewAction action="#{loginBean.requireLogin}" />
        </f:metadata>
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateCartItemTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.CreateCartItemLabel_dateAdded}" for="dateAdded" />
                    <h:inputText id="dateAdded" value="#{cartItemController.selected.dateAdded}" title="#{bundle.CreateCartItemTitle_dateAdded}" >
                        <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                    </h:inputText>
                    <h:outputLabel value="#{bundle.CreateCartItemLabel_appUser}" for="appUser" />
                    <h:selectOneMenu id="appUser" value="#{cartItemController.selected.appUser}" title="#{bundle.CreateCartItemTitle_appUser}" required="true" requiredMessage="#{bundle.CreateCartItemRequiredMessage_appUser}">
                        <f:selectItems value="#{appUserController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                    <h:outputLabel value="#{bundle.CreateCartItemLabel_item}" for="item" />
                    <h:selectOneMenu id="item" value="#{cartItemController.selected.item}" title="#{bundle.CreateCartItemTitle_item}" required="true" requiredMessage="#{bundle.CreateCartItemRequiredMessage_item}">
                        <f:selectItems value="#{itemController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{cartItemController.create}" value="#{bundle.CreateCartItemSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{cartItemController.prepareList}" value="#{bundle.CreateCartItemShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.CreateCartItemIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
