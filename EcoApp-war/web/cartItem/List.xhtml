<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <f:metadata>
            <f:viewAction action="#{loginBean.requireLogin}" />
        </f:metadata>
        <ui:define name="title">My Cart</ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>

                <h2>Cart</h2>
                <h:panelGroup rendered="#{cartItemController.cartItemCount == 0}">
                    <p class="home-empty">Your cart is empty.</p>
                </h:panelGroup>
                <h:panelGroup rendered="#{cartItemController.cartItemCount > 0}">
                    <h:dataTable value="#{cartItemController.cartItemList}" var="item" styleClass="browse-table" rowClasses="jsfcrud_odd_row,jsfcrud_even_row">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Date Added"/>
                            </f:facet>
                            <h:outputText value="#{item.dateAdded}">
                                <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Item"/>
                            </f:facet>
                            <h:outputText value="#{item.item.title}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Seller"/>
                            </f:facet>
                            <h:outputText value="#{item.item.sellerId.username}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Price"/>
                            </f:facet>
                            <h:outputText value="$#{item.item.price}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="&nbsp;"/>
                            </f:facet>
                            <h:commandButton value="Remove" action="#{cartItemController.removeFromCart(item)}" styleClass="btn btn-outline" />
                        </h:column>
                    </h:dataTable>
                    <div style="margin-top: 14px; text-align: center;">
                        <h:commandButton value="Purchase All" action="#{cartItemController.purchaseAll}" styleClass="btn" />
                    </div>
                </h:panelGroup>

                <hr style="margin: 28px 0; border: none; border-top: 2px solid #d4e4d4;" />

                <h2>Purchase History</h2>
                <h:panelGroup rendered="#{cartItemController.historyCount == 0}">
                    <p class="home-empty">No purchase history yet.</p>
                </h:panelGroup>
                <h:panelGroup rendered="#{cartItemController.historyCount > 0}">
                    <h:outputText value="#{cartItemController.historyPagination.pageFirstItem + 1}..#{cartItemController.historyPagination.pageLastItem + 1}/#{cartItemController.historyPagination.itemsCount}"/>&nbsp;
                    <h:commandLink action="#{cartItemController.historyPrevious}" value="#{bundle.Previous} #{cartItemController.historyPagination.pageSize}" rendered="#{cartItemController.historyPagination.hasPreviousPage}"/>&nbsp;
                    <h:commandLink action="#{cartItemController.historyNext}" value="#{bundle.Next} #{cartItemController.historyPagination.pageSize}" rendered="#{cartItemController.historyPagination.hasNextPage}"/>&nbsp;
                    <h:dataTable value="#{cartItemController.historyItems}" var="item" styleClass="browse-table" rowClasses="jsfcrud_odd_row,jsfcrud_even_row">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Date Purchased"/>
                            </f:facet>
                            <h:outputText value="#{item.dateAdded}">
                                <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Item"/>
                            </f:facet>
                            <h:outputText value="#{item.item.title}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Seller"/>
                            </f:facet>
                            <h:outputText value="#{item.item.sellerId.username}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Price"/>
                            </f:facet>
                            <h:outputText value="$#{item.item.price}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
