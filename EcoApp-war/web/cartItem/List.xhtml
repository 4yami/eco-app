<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <f:metadata>
            <f:viewAction action="#{loginBean.requireLogin}" />
        </f:metadata>
        <ui:define name="title">
            <h:outputText value="My Purchases"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <h:outputText escape="false" value="You haven't purchased any items yet." rendered="#{cartItemController.items.rowCount == 0}"/>
                <h:panelGroup rendered="#{cartItemController.items.rowCount > 0}">
                    <h:outputText value="#{cartItemController.pagination.pageFirstItem + 1}..#{cartItemController.pagination.pageLastItem + 1}/#{cartItemController.pagination.itemsCount}"/>&nbsp;
                    <h:commandLink action="#{cartItemController.previous}" value="#{bundle.Previous} #{cartItemController.pagination.pageSize}" rendered="#{cartItemController.pagination.hasPreviousPage}"/>&nbsp;
                    <h:commandLink action="#{cartItemController.next}" value="#{bundle.Next} #{cartItemController.pagination.pageSize}" rendered="#{cartItemController.pagination.hasNextPage}"/>&nbsp;
                    <h:dataTable value="#{cartItemController.items}" var="item" border="0" cellpadding="2" cellspacing="0" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" rules="all" style="border:solid 1px">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Date Purchased"/>
                            </f:facet>
                            <h:outputText value="#{item.dateAdded}">
                                <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Item"/>
                            </f:facet>
                            <h:outputText value="#{item.item.title}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Seller"/>
                            </f:facet>
                            <h:outputText value="#{item.item.sellerId.username}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Status"/>
                            </f:facet>
                            <h:outputText value="#{item.item.status}" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="&nbsp;"/>
                            </f:facet>
                            <h:commandButton value="Cancel Purchase" action="#{cartItemController.cancelPurchase(item)}"
                                rendered="#{item.item.status == 'IN_CART'}"
                                styleClass="btn" />
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
                
            </h:form>
        </ui:define>
    </ui:composition>

</html>
