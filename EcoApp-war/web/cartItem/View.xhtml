<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <f:metadata>
            <f:viewAction action="#{loginBean.requireLogin}" />
        </f:metadata>
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewCartItemTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputText value="#{bundle.ViewCartItemLabel_dateAdded}"/>
                    <h:outputText value="#{cartItemController.selected.dateAdded}" title="#{bundle.ViewCartItemTitle_dateAdded}">
                        <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                    </h:outputText>
                    <h:outputText value="#{bundle.ViewCartItemLabel_appUser}"/>
                    <h:outputText value="#{cartItemController.selected.appUser}" title="#{bundle.ViewCartItemTitle_appUser}"/>
                    <h:outputText value="#{bundle.ViewCartItemLabel_item}"/>
                    <h:outputText value="#{cartItemController.selected.item}" title="#{bundle.ViewCartItemTitle_item}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{cartItemController.destroyAndView}" value="#{bundle.ViewCartItemDestroyLink}" rendered="#{loginBean.loggedIn}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewCartItemEditLink}" rendered="#{loginBean.loggedIn}"/>
                <br />
                <h:commandLink action="#{cartItemController.prepareCreate}" value="#{bundle.ViewCartItemCreateLink}" rendered="#{loginBean.loggedIn}"/>
                <br />
                <h:commandLink action="#{cartItemController.prepareList}" value="#{bundle.ViewCartItemShowAllLink}"/>
                

            </h:form>
        </ui:define>
    </ui:composition>

</html>
