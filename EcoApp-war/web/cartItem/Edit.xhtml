<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <f:metadata>
            <f:viewAction action="#{loginBean.requireLogin}" />
        </f:metadata>
        <ui:define name="title">
            <h:outputText value="#{bundle.EditCartItemTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2" styleClass="panel-grid-form" columnClasses="labelCol,inputCol">
                    <h:outputLabel value="#{bundle.EditCartItemLabel_dateAdded}" for="dateAdded" />
                    <h:inputText id="dateAdded" value="#{cartItemController.selected.dateAdded}" title="#{bundle.EditCartItemTitle_dateAdded}" style="width: 100%;">
                        <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                    </h:inputText>
                    <h:outputLabel value="#{bundle.EditCartItemLabel_appUser}" for="appUser" />
                    <h:selectOneMenu id="appUser" value="#{cartItemController.selected.appUser}" title="#{bundle.EditCartItemTitle_appUser}" required="true" requiredMessage="#{bundle.EditCartItemRequiredMessage_appUser}" style="width: 100%;">
                        <f:selectItems value="#{appUserController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                    <h:outputLabel value="#{bundle.EditCartItemLabel_item}" for="item" />
                    <h:selectOneMenu id="item" value="#{cartItemController.selected.item}" title="#{bundle.EditCartItemTitle_item}" required="true" requiredMessage="#{bundle.EditCartItemRequiredMessage_item}" style="width: 100%;">
                        <f:selectItems value="#{itemController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <h:commandLink action="#{cartItemController.update}" value="#{bundle.EditCartItemSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditCartItemViewLink}"/>
                <br />
                <h:commandLink action="#{cartItemController.prepareList}" value="#{bundle.EditCartItemShowAllLink}" immediate="true"/>
                
            </h:form>
        </ui:define>
    </ui:composition>

</html>
