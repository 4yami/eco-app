<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <f:metadata>
            <f:viewAction action="#{loginBean.requireAdmin}" />
        </f:metadata>
        <ui:define name="title">
            <h:outputText value="#{bundle.ListAppUserTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <div class="list-toolbar">
                    <span class="list-toolbar-left">
                        <h:outputText escape="false" value="#{bundle.ListAppUserEmpty}" rendered="#{appUserController.items.rowCount == 0}"/>
                        <h:panelGroup rendered="#{appUserController.items.rowCount > 0}">
                            <h:outputText value="#{appUserController.pagination.pageFirstItem + 1}..#{appUserController.pagination.pageLastItem + 1}/#{appUserController.pagination.itemsCount}"/>&nbsp;
                            <h:commandLink action="#{appUserController.previous}" value="#{bundle.Previous} #{appUserController.pagination.pageSize}" rendered="#{appUserController.pagination.hasPreviousPage}"/>&nbsp;
                            <h:commandLink action="#{appUserController.next}" value="#{bundle.Next} #{appUserController.pagination.pageSize}" rendered="#{appUserController.pagination.hasNextPage}"/>&nbsp;
                        </h:panelGroup>
                    </span>
                    <span class="list-toolbar-right">
                        <h:commandButton action="#{appUserController.prepareCreate}" value="#{bundle.ListAppUserCreateLink}" rendered="#{loginBean.admin}" styleClass="btn" />
                    </span>
                </div>
                <h:panelGroup rendered="#{appUserController.items.rowCount > 0}">
                    <h:dataTable value="#{appUserController.items}" var="item" border="0" cellpadding="2" cellspacing="0" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" rules="all" style="border:solid 1px">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListAppUserTitle_id}"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListAppUserTitle_username}"/>
                            </f:facet>
                            <h:outputText value="#{item.username}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListAppUserTitle_email}"/>
                            </f:facet>
                            <h:outputText value="#{item.email}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListAppUserTitle_password}"/>
                            </f:facet>
                            <h:outputText value="#{item.password}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListAppUserTitle_phone}"/>
                            </f:facet>
                            <h:outputText value="#{item.phone}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListAppUserTitle_roleId}"/>
                            </f:facet>
                            <h:outputText value="#{item.roleId}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="&nbsp;"/>
                            </f:facet>
                            <h:commandLink action="#{appUserController.prepareView}" value="#{bundle.ListAppUserViewLink}" rendered="#{loginBean.admin}"/>
                            <h:outputText value=" " rendered="#{loginBean.admin}"/>
                            <h:commandLink action="#{appUserController.prepareEdit}" value="#{bundle.ListAppUserEditLink}" rendered="#{loginBean.admin}"/>
                            <h:outputText value=" " rendered="#{loginBean.admin}"/>
                            <h:commandLink action="#{appUserController.destroy}" value="#{bundle.ListAppUserDestroyLink}" rendered="#{loginBean.admin}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
                
            </h:form>
        </ui:define>
    </ui:composition>

</html>
