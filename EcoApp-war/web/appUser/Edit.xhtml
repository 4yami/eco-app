<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <f:metadata>
            <f:viewAction action="#{loginBean.requireAdmin}" />
        </f:metadata>
        <ui:define name="title">
            <h:outputText value="#{bundle.EditAppUserTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditAppUserLabel_id}" for="id" />
                    <h:inputText id="id" value="#{appUserController.selected.id}" title="#{bundle.EditAppUserTitle_id}" required="true" requiredMessage="#{bundle.EditAppUserRequiredMessage_id}"/>
                    <h:outputLabel value="#{bundle.EditAppUserLabel_username}" for="username" />
                    <h:inputText id="username" value="#{appUserController.selected.username}" title="#{bundle.EditAppUserTitle_username}" required="true" requiredMessage="#{bundle.EditAppUserRequiredMessage_username}"/>
                    <h:outputLabel value="#{bundle.EditAppUserLabel_email}" for="email" />
                    <h:inputText id="email" value="#{appUserController.selected.email}" title="#{bundle.EditAppUserTitle_email}" required="true" requiredMessage="#{bundle.EditAppUserRequiredMessage_email}"/>
                    <h:outputLabel value="#{bundle.EditAppUserLabel_password}" for="password" />
                    <h:inputText id="password" value="#{appUserController.selected.password}" title="#{bundle.EditAppUserTitle_password}" required="true" requiredMessage="#{bundle.EditAppUserRequiredMessage_password}"/>
                    <h:outputLabel value="#{bundle.EditAppUserLabel_phone}" for="phone" />
                    <h:inputText id="phone" value="#{appUserController.selected.phone}" title="#{bundle.EditAppUserTitle_phone}" required="true" requiredMessage="#{bundle.EditAppUserRequiredMessage_phone}"/>
                    <h:outputLabel value="#{bundle.EditAppUserLabel_roleId}" for="roleId" />
                    <h:selectOneMenu id="roleId" value="#{appUserController.selected.roleId}" title="#{bundle.EditAppUserTitle_roleId}" required="true" requiredMessage="#{bundle.EditAppUserRequiredMessage_roleId}">
                        <f:selectItems value="#{roleController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <h:commandLink action="#{appUserController.update}" value="#{bundle.EditAppUserSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditAppUserViewLink}"/>
                <br />
                <h:commandLink action="#{appUserController.prepareList}" value="#{bundle.EditAppUserShowAllLink}" immediate="true"/>
                
            </h:form>
        </ui:define>
    </ui:composition>

</html>
