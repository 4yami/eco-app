<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateAppUserTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.CreateAppUserLabel_id}" for="id" />
                    <h:inputText id="id" value="#{appUserController.selected.id}" title="#{bundle.CreateAppUserTitle_id}" required="true" requiredMessage="#{bundle.CreateAppUserRequiredMessage_id}"/>
                    <h:outputLabel value="#{bundle.CreateAppUserLabel_username}" for="username" />
                    <h:inputText id="username" value="#{appUserController.selected.username}" title="#{bundle.CreateAppUserTitle_username}" required="true" requiredMessage="#{bundle.CreateAppUserRequiredMessage_username}"/>
                    <h:outputLabel value="#{bundle.CreateAppUserLabel_email}" for="email" />
                    <h:inputText id="email" value="#{appUserController.selected.email}" title="#{bundle.CreateAppUserTitle_email}" required="true" requiredMessage="#{bundle.CreateAppUserRequiredMessage_email}"/>
                    <h:outputLabel value="#{bundle.CreateAppUserLabel_password}" for="password" />
                    <h:inputText id="password" value="#{appUserController.selected.password}" title="#{bundle.CreateAppUserTitle_password}" required="true" requiredMessage="#{bundle.CreateAppUserRequiredMessage_password}"/>
                    <h:outputLabel value="#{bundle.CreateAppUserLabel_phone}" for="phone" />
                    <h:inputText id="phone" value="#{appUserController.selected.phone}" title="#{bundle.CreateAppUserTitle_phone}" required="true" requiredMessage="#{bundle.CreateAppUserRequiredMessage_phone}"/>
                    <h:outputLabel value="#{bundle.CreateAppUserLabel_roleId}" for="roleId" />
                    <h:selectOneMenu id="roleId" value="#{appUserController.selected.roleId}" title="#{bundle.CreateAppUserTitle_roleId}" >
                        <f:selectItems value="#{roleController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{appUserController.create}" value="#{bundle.CreateAppUserSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{appUserController.prepareList}" value="#{bundle.CreateAppUserShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.CreateAppUserIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
