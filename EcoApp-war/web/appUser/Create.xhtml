<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <ui:composition template="/template.xhtml">
        <f:metadata>
            <f:viewAction action="#{loginBean.requireAdmin}" />
        </f:metadata>
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateAppUserTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2" styleClass="panel-grid-form" columnClasses="labelCol,inputCol">
                    <h:outputLabel value="#{bundle.CreateAppUserLabel_id}" for="id" />
                    <h:inputText id="id" value="#{appUserController.selected.id}" title="#{bundle.CreateAppUserTitle_id}" required="true" requiredMessage="#{bundle.CreateAppUserRequiredMessage_id}" style="width: 100%;"/>
                    <h:outputLabel value="#{bundle.CreateAppUserLabel_username}" for="username" />
                    <h:inputText id="username" value="#{appUserController.selected.username}" title="#{bundle.CreateAppUserTitle_username}" required="true" requiredMessage="#{bundle.CreateAppUserRequiredMessage_username}" style="width: 100%;"/>
                    <h:outputLabel value="#{bundle.CreateAppUserLabel_email}" for="email" />
                    <h:inputText id="email" value="#{appUserController.selected.email}" title="#{bundle.CreateAppUserTitle_email}" required="true" requiredMessage="#{bundle.CreateAppUserRequiredMessage_email}" style="width: 100%;"/>
                    <h:outputLabel value="#{bundle.CreateAppUserLabel_password}" for="password" />
                    <h:inputText id="password" value="#{appUserController.selected.password}" title="#{bundle.CreateAppUserTitle_password}" required="true" requiredMessage="#{bundle.CreateAppUserRequiredMessage_password}" style="width: 100%;"/>
                    <h:outputLabel value="#{bundle.CreateAppUserLabel_phone}" for="phone" />
                    <h:inputText id="phone" value="#{appUserController.selected.phone}" title="#{bundle.CreateAppUserTitle_phone}" required="true" requiredMessage="#{bundle.CreateAppUserRequiredMessage_phone}" style="width: 100%;"/>
                    <h:outputLabel value="#{bundle.CreateAppUserLabel_roleId}" for="roleId" />
                    <h:selectOneMenu id="roleId" value="#{appUserController.selected.roleId}" title="#{bundle.CreateAppUserTitle_roleId}" required="true" requiredMessage="#{bundle.CreateAppUserRequiredMessage_roleId}" style="width: 100%;">
                        <f:selectItems value="#{roleController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <br />
                <h:commandButton action="#{appUserController.create}" value="#{bundle.CreateAppUserSaveLink}" styleClass="btn" />
        
    
                
            </h:form>
        </ui:define>
    </ui:composition>

</html>
