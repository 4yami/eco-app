<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <ui:composition template="/template.xhtml">
        <ui:define name="title">Create an Account</ui:define>
        <ui:define name="body">
            <div class="form-card">
                <h:form id="registerForm">
                    <h2>Register New Account</h2>

                    <div class="messages">
                        <h:messages infoClass="info" errorClass="error" />
                    </div>

                    <h:panelGrid columns="2" cellpadding="5" styleClass="panel-grid-form">
                        <h:outputLabel for="email" value="Email Address:" />
                        <h:inputText id="email" value="#{registerBean.email}" 
                                     required="true" requiredMessage="Email is required.">
                            <f:validateRegex pattern="^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$" />
                        </h:inputText>

                        <h:outputLabel for="username" value="Username:" />
                        <h:inputText id="username" value="#{registerBean.username}" 
                                     required="true" requiredMessage="Username is required." />

                        <h:outputLabel for="password" value="Password:" />
                        <h:inputSecret id="password" value="#{registerBean.password}" 
                                       required="true" requiredMessage="Password is required.">
                            <f:validateLength minimum="6" />
                        </h:inputSecret>

                        <h:outputLabel for="phone" value="Phone:" />
                        <h:inputText id="phone" value="#{registerBean.phone}"
                                     required="true" requiredMessage="Phone is required.">
                            <f:validateLength minimum="7" maximum="20" />
                        </h:inputText>
                    </h:panelGrid>

                    <br />
                    <h:commandButton value="Sign Up" action="#{registerBean.register}" styleClass="btn btn-full" />

                    <p style="margin-top: 16px; text-align: center;">
                        Already registered? <h:link outcome="login" value="Back to Login" />
                    </p>
                </h:form>
            </div>
        </ui:define>
    </ui:composition>
</html>
